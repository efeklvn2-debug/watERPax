name: Docker

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      repo_lower: ${{ steps.names.outputs.repo_lower }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image names (GHCR requires lowercase)
        id: names
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.names.outputs.repo_lower }}-backend:latest
            ${{ env.REGISTRY }}/${{ steps.names.outputs.repo_lower }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.names.outputs.repo_lower }}-web:latest
            ${{ env.REGISTRY }}/${{ steps.names.outputs.repo_lower }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-push
    # Runs only when the deploy secrets/variable are configured (see
    # docs/DEPLOYMENT.md). Otherwise this job is skipped and deployment is
    # done manually from the server with `docker compose pull && up -d`.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull & restart stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/waterpax
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8088/api/health > /dev/null; then
                echo "waterpax healthy"
                exit 0
              fi
              sleep 2
            done
            echo "waterpax failed to become healthy after deploy"
            docker compose logs --tail 50 backend
            exit 1

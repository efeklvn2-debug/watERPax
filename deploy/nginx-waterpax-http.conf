# waterpax.com.ng — port 80: ACME webroot + redirect to HTTPS
# 443 block is added after cert issuance (see docs/DEPLOYMENT.md)
server {
    listen 80;
    listen [::]:80;
    server_name waterpax.com.ng www.waterpax.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/waterpax;
    }

    location / {
        return 301 https://waterpax.com.ng$request_uri;
    }
}
